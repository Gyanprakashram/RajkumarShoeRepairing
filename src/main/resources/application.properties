spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]
spring.application.name=rajkumar-cobbler-platform

server.error.include-message=never
server.ssl.enabled=false
server.ssl.key-store=
server.ssl.key-store-password=
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=

logging.level.com.rajkumar.shoe=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

app.jwt-expiration-ms=900000
app.session-idle-timeout-ms=300000
app.auth.otp-length=6
app.auth.otp-ttl-minutes=5
app.auth.otp-max-attempts=5
app.auth.otp-lock-minutes=15
app.shop.name=Raj Kumar Shoe Repairing
app.shop.address=Bistupur, Jamshedpur, Jharkhand
app.api-encryption.enabled=false
app.api-encryption.key=

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=rajkumar-workshop-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.common.serialization.JsonDeserializer

app.gemini.api-key=
app.razorpay.key-id=
app.razorpay.key-secret=
app.razorpay.webhook-secret=

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notifications.whatsapp-token=
app.notifications.whatsapp-phone-number-id=
app.notifications.whatsapp-api-version=v22.0
app.notifications.whatsapp-template=order_update
app.notifications.whatsapp-language=en
app.notifications.whatsapp-country-code=91
app.notifications.sms-account-sid=
app.notifications.sms-auth-token=
app.notifications.sms-from=
