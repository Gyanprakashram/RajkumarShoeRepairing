server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${NEON_HOST}:${NEON_PORT:5432}/${NEON_DATABASE}?sslmode=require
spring.datasource.username=${NEON_USERNAME}
spring.datasource.password=${NEON_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

app.jwt-secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL}
app.auth.otp-required=${OTP_REQUIRED:true}
app.auth.otp-debug=false
app.admin-phone=${ADMIN_PHONE}
app.admin-password=${ADMIN_PASSWORD}
app.cors-origin=${CORS_ORIGIN}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
app.notifications.email-from=${SMTP_FROM:${spring.mail.username}}
app.notifications.email-to=${ORDER_NOTIFICATION_EMAIL:}
app.notifications.admin-phone=${ADMIN_PHONE}
